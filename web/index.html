<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#181A22">
<title>咫尺 · 一起在桌边</title>
<!-- 声网。App ID 留空 = 用浏览器原生 WebRTC。项目开了 App 证书，token 由中继签发；
     临时 token 从控制台生成时填 agora-token，并把 agora-channel 填成那个固定频道。 -->
<meta name="agora-app-id" content="ed991ae46d4a404ca2d5347633e3916c">
<meta name="agora-token" content="">
<meta name="agora-channel" content="">
<!-- 中继地址。留空 = 和网页同一台机器。网页放在 Pages 上时中继在别处，填在这里或打开一次 ?relay=wss://…/ws -->
<meta name="relay" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<script type="module" src="/src/main.ts"></script>
</head>
<body>
<div class="ambient"><div class="glow glow-a"></div><div class="glow glow-b"></div></div>
<svg class="vig-defs" aria-hidden="true"><defs>
  <filter id="rough" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="5" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
  </filter>
  <radialGradient id="lampcone" cx="50%" cy="0%" r="80%">
    <stop offset="0" stop-color="#F0B25A" stop-opacity=".5"/><stop offset="1" stop-color="#F0B25A" stop-opacity="0"/>
  </radialGradient>
  <!-- 手绘头像：四款，按名字散列选一个 -->
  <g id="av-granny"><g filter="url(#rough)" class="hand"><circle cx="46" cy="44" r="17"/><path d="M 30,34 Q 46,18 62,34"/><circle cx="58" cy="24" r="6"/><circle cx="40" cy="46" r="4.6" stroke-width="1.4"/><circle cx="52" cy="46" r="4.6" stroke-width="1.4"/><path d="M 44.6,46 L 47.4,46" stroke-width="1.4"/><path d="M 41,55 Q 46,59 51,55" stroke-width="1.5"/><path d="M 24,84 Q 28,64 46,62 Q 64,64 68,84"/></g></g>
  <g id="av-grandpa"><g filter="url(#rough)" class="hand"><circle cx="46" cy="44" r="17"/><path d="M 30,40 Q 46,26 62,40"/><path d="M 34,44 l 8,0 M 50,44 l 8,0" stroke-width="1.5"/><path d="M 36,60 Q 46,54 56,60" stroke-width="1.5"/><path d="M 40,54 Q 46,57 52,54" stroke-width="1.3"/><path d="M 24,84 Q 28,64 46,62 Q 64,64 68,84"/></g></g>
  <g id="av-kid"><g filter="url(#rough)" class="hand"><circle cx="46" cy="46" r="16"/><path d="M 28,40 Q 46,22 64,40 L 70,38" /><circle cx="40" cy="47" r="1.8" fill="var(--amber)"/><circle cx="52" cy="47" r="1.8" fill="var(--amber)"/><path d="M 40,55 Q 46,61 52,55" stroke-width="1.6"/><path d="M 26,84 Q 30,66 46,64 Q 62,66 66,84"/></g></g>
  <g id="av-mom"><g filter="url(#rough)" class="hand"><circle cx="46" cy="45" r="16"/><path d="M 28,52 Q 26,26 46,26 Q 66,26 64,52"/><path d="M 30,52 Q 30,40 36,34 M 62,52 Q 62,40 56,34" stroke-width="1.3" opacity=".7"/><circle cx="40" cy="47" r="1.8" fill="var(--amber)"/><circle cx="52" cy="47" r="1.8" fill="var(--amber)"/><path d="M 41,55 Q 46,59 51,55" stroke-width="1.5"/><path d="M 26,84 Q 30,66 46,64 Q 62,66 66,84"/></g></g>
  <!-- 图标 -->
  <g id="ic-go"><g class="hand" stroke-width="2.2"><path d="M 10,14 H 38 M 10,24 H 38 M 10,34 H 38 M 14,10 V 38 M 24,10 V 38 M 34,10 V 38" stroke-width="1.4" opacity=".55"/><circle cx="24" cy="24" r="6" fill="var(--amber)" stroke="none"/><circle cx="34" cy="14" r="5.4"/></g></g>
  <g id="ic-paper"><g class="hand" stroke-width="2.2"><path d="M 8,32 L 24,10 L 40,32 Z"/><path d="M 24,10 L 24,32" stroke-width="1.5" opacity=".7"/><path d="M 6,36 Q 24,42 42,36"/></g></g>
  <g id="ic-tea"><g class="hand" stroke-width="2.2"><path d="M 10,20 H 34 V 30 Q 34,40 22,40 Q 10,40 10,30 Z"/><path d="M 34,23 Q 42,23 42,29 Q 42,34 34,33"/><path d="M 6,43 H 38" stroke-width="1.6" opacity=".7"/><path class="stm" d="M 17,15 q -3,-4 0,-8" stroke-width="1.6" opacity=".8"/><path class="stm" d="M 25,15 q -3,-4 0,-8" stroke-width="1.6" opacity=".8" style="animation-delay:.8s"/></g></g>
  <g id="ic-back"><g class="hand" stroke-width="2.6"><path d="M 30,12 L 18,24 L 30,36"/></g></g>
  <g id="ic-next"><g class="hand" stroke-width="2.6"><path d="M 18,12 L 30,24 L 18,36"/></g></g>
  <g id="ic-bye"><g class="hand" stroke-width="2.4"><path d="M 14,14 L 34,34 M 34,14 L 14,34"/></g></g>
  <g id="ic-smile"><g class="hand" stroke-width="2.4"><circle cx="24" cy="24" r="15"/><path d="M 17,20 l 0,2 M 31,20 l 0,2" stroke-width="2.6"/><path d="M 16,28 Q 24,36 32,28" stroke-width="2.2"/></g></g>
  <!-- 表情：飘在对方画面上的那几个 -->
  <g id="rx-heart"><path d="M 24,41 C 8,30 5,16 14,12 c 5,-2 9,2 10,5 c 1,-3 5,-7 10,-5 c 9,4 6,18 -10,29 z" fill="var(--amber)"/></g>
  <g id="rx-thumb"><g class="hand" stroke-width="2.4"><path d="M 14,22 H 8 V 40 H 14 Z"/><path d="M 14,24 L 22,10 Q 27,8 26,14 L 24,22 H 38 Q 42,22 41,27 L 38,38 Q 37,40 34,40 H 14"/></g></g>
  <g id="rx-laugh"><g class="hand" stroke-width="2.4"><circle cx="24" cy="24" r="16"/><path d="M 15,19 l 5,0 M 28,19 l 5,0" stroke-width="2"/><path d="M 14,27 Q 24,41 34,27 Z" fill="var(--amber)" stroke="none"/></g></g>
  <g id="rx-party"><g class="hand" stroke-width="2.4"><path d="M 10,40 L 19,16 L 32,29 Z"/><path d="M 19,16 L 23,8 M 32,29 L 40,27 M 27,22 L 35,14" stroke-width="2"/><circle cx="39" cy="10" r="2" fill="var(--amber)" stroke="none"/><circle cx="12" cy="14" r="2" fill="var(--amber)" stroke="none"/><circle cx="42" cy="20" r="1.6" fill="var(--amber)" stroke="none"/></g></g>
</defs></svg>

<!-- 起名 -->
<section class="screen setup" id="s-setup">
  <svg class="lampart" viewBox="0 0 170 150" role="img" aria-label="一盏暖光台灯">
    <path d="M 55,52 L 115,52 L 150,140 L 20,140 Z" fill="url(#lampcone)" class="lampglow"/>
    <g filter="url(#rough)" class="hand">
      <g class="br"><path class="dw" pathLength="100" d="M 60,52 Q 85,30 110,52"/><path class="dw" pathLength="100" d="M 58,52 L 112,52" style="animation-delay:.1s"/>
      <path class="dw" pathLength="100" d="M 85,30 Q 100,10 128,18" style="animation-delay:.2s"/><path class="dw" pathLength="100" d="M 128,18 L 132,60" style="animation-delay:.3s"/>
      <path class="dw" pathLength="100" d="M 116,62 Q 132,66 148,62" style="animation-delay:.4s"/></g>
      <path class="dw" pathLength="100" d="M 14,142 Q 85,138 156,142" stroke-width="1.5" opacity=".7" style="animation-delay:.5s"/>
    </g>
  </svg>
  <h1>咫尺<small>相隔千里，坐到同一张桌边</small></h1>
  <div class="field"><label for="nm">我叫</label><input id="nm" data-nav placeholder="奶奶 / 小宇 / 妈妈" maxlength="12" autocomplete="off" enterkeyhint="go"></div>
  <button class="btn wide" id="b-start" data-nav>开始</button>
</section>

<!-- 找好友 -->
<section class="screen home" id="s-home">
  <div class="bar">
    <div class="me">我是 <b id="h-me">—</b></div>
    <span class="pill" id="h-desk"><i></i><span>桌子未连上</span></span>
    <button class="pill" id="h-code" data-nav>好友码 <b id="h-codev">——</b></button>
  </div>
  <h2>想找谁坐一会儿？</h2>
  <div class="friends" id="friends"></div>
</section>

<!-- 邀请 -->
<section class="screen ring" id="s-invite">
  <div class="avatar pulse" id="i-av"></div>
  <svg class="gicon" viewBox="0 0 48 48" id="i-gicon"></svg>
  <h2 id="i-title">—<small id="i-sub"></small></h2>
  <div class="row" id="i-row"></div>
</section>

<!-- 会话：对方的画面在远端，场景在中间（由 scenes/ 注册生成），菜单在手边 -->
<section class="screen session" id="s-session">
  <div class="far">
    <div class="react" id="react"></div>
    <div class="remote" id="remote">
      <video id="v-remote" autoplay playsinline></video>
      <div class="novid" id="novid">等对方的桌面…</div>
      <div class="tag"><span class="avatar" id="c-av"></span><b id="c-name">—</b><span class="t" id="c-time">00:00</span></div>
      <div class="overlay" id="ov"><div class="badge" id="badge"></div></div>
    </div>
    <div class="self" id="self"><video id="v-me" autoplay playsinline muted></video></div>
  </div>
  <div class="mid" id="mid"></div>
  <div class="dock" id="dock"></div>
</section>

<!-- 抽屉：选游戏 -->
<div class="veil" id="sh-game"><div class="sheet">
  <h3><span class="avatar" id="g-av"></span><span id="g-title">和 — 一起…</span></h3>
  <div class="games" id="g-list"></div>
</div></div>

<!-- 抽屉：表情（投影端用遥控器选） -->
<div class="veil" id="sh-react"><div class="sheet">
  <h3>给 TA 一个表情</h3>
  <div class="games" id="r-list"></div>
</div></div>

<!-- 抽屉：加好友 -->
<div class="veil" id="sh-add"><div class="sheet">
  <h3>加好友</h3>
  <div class="addwrap">
    <div class="mycode">
      <div class="lbl">我的好友码</div>
      <div class="code" id="a-mine">——</div>
      <p>念给家人听，让 TA 在自己那边输进去。<br>或者发一个链接，TA 点开就加上了。</p>
      <button class="btn ghost wide" id="a-link" data-nav>复制邀请链接</button>
    </div>
    <div>
      <div class="lbl">输入对方的好友码</div>
      <div class="slots" id="a-slots"></div>
      <div class="keys" id="a-keys"></div>
    </div>
  </div>
</div></div>

<div class="keyhint" id="keyhint"></div>
<div class="netpill" id="net"><i></i><span>连接中</span></div>
<div class="toast" id="toast"></div>
</body>
</html>
